name: Travel Times Batch (OTP)

# Issue #82（前泊判定と移動時間の事前計算）用のバッチワークフロー。
# OTP（OpenTripPlanner）は常設サーバーを持たない。この使い捨てランナー上でのみ
# グラフビルド → サーバー起動 → 移動時間計算 → 破棄を行う。
# 生成された SQL はワークフロー成果物としてアップロードするのみで、D1への適用は行わない
# （人間が生成物をレビューした上で手動 `wrangler d1 execute` を実行する運用）。
#
# NOTE: scripts/calc-travel-times.js は OTP 版への差し替えが別PR (#157) で進行中で、
#       このブランチ時点ではまだ旧 Google Maps Routes API 版のまま。
#       #157 がマージされ次第、このワークフローはそのまま OTP 版を実行できる想定。
on:
  workflow_dispatch:
    inputs:
      osm_region:
        description: 'Geofabrik OSMリージョン名（例: kanto, japan）'
        required: false
        default: 'kanto'
      java_xmx:
        description: 'OTPコンテナに割り当てるJVMヒープサイズ（例: 6g）'
        required: false
        default: '6g'

permissions:
  contents: read

env:
  OTP_BUILD_DIR: ${{ github.workspace }}/.otp-build

jobs:
  build-graph-and-calc:
    name: Build OTP graph & calculate travel times
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build OTP graph (OSM + GTFS-JP)
        env:
          OSM_REGION: ${{ inputs.osm_region }}
          JAVA_XMX: ${{ inputs.java_xmx }}
          # GTFS_URLS: カンマ区切りでGTFS zip URLを渡す場合はここに設定
          # （現時点ではODPTのAPIキー未取得のため空 = OSMのみでビルドされる）
        run: bash scripts/build-otp-graph.sh

      - name: Start OTP server
        env:
          JAVA_XMX: ${{ inputs.java_xmx }}
        run: |
          docker run -d --name otp-server -p 8080:8080 \
            -e JAVA_TOOL_OPTIONS="-Xmx${JAVA_XMX}" \
            -v "${OTP_BUILD_DIR}:/var/opentripplanner" \
            opentripplanner/opentripplanner:latest \
            --load --serve

      - name: Wait for OTP server readiness
        run: |
          echo "OTPサーバーの起動を待機中..."
          for i in $(seq 1 30); do
            if curl -fsS -X POST http://localhost:8080/otp/routers/default/index/graphql \
                -H "Content-Type: application/json" \
                --data-binary '{"query":"{ routers { routerId } }"}' >/dev/null 2>&1; then
              echo "OTPサーバー起動確認"
              exit 0
            fi
            echo "  待機中... (${i}/30)"
            sleep 10
          done
          echo "エラー: OTPサーバーが5分以内に起動しませんでした" >&2
          docker logs otp-server || true
          exit 1

      - name: Calculate travel times
        run: node scripts/calc-travel-times.js
        env:
          OTP_BASE_URL: http://localhost:8080

      - name: Stop OTP server
        if: always()
        run: |
          docker stop otp-server || true
          docker rm otp-server || true

      - name: Upload travel times SQL artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: seed-travel-times-sql
          path: migrations/seed-travel-times.sql
          if-no-files-found: warn
          retention-days: 30
